<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash of Perps</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(180deg, #0a0a1f 0%, #1a0033 100%);
      color: white;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .container {
      text-align: center;
      z-index: 10;
    }

    .logo {
      font-size: 52px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
      letter-spacing: 4px;
    }

    .subtitle {
      font-size: 22px;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    .progress-container {
      width: 420px;
      height: 28px;
      background: #111;
      border: 3px solid #00ffff;
      border-radius: 20px;
      overflow: hidden;
      margin: 0 auto 30px;
      box-shadow: 0 0 20px #00ffff;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00ffff, #ff00ff);
      transition: width 0.3s linear;
      box-shadow: 0 0 15px #ff00ff;
    }

    .status {
      font-size: 18px;
      margin-top: 15px;
      min-height: 28px;
    }

    .spark {
      position: absolute;
      color: #ffff00;
      font-size: 24px;
      animation: spark 1.5s linear infinite;
      pointer-events: none;
      text-shadow: 0 0 10px yellow;
    }

    @keyframes spark {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(3) translateY(-100px); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">CLASH OF PERPS</div>
    <div class="subtitle">Загрузка мира...</div>
    
    <div class="progress-container">
      <div class="progress-bar" id="progress"></div>
    </div>
    
    <div class="status" id="status">Подготовка ресурсов...</div>
  </div>

  <script>
    let progress = 0;
    const progressBar = document.getElementById('progress');
    const statusText = document.getElementById('status');

    const messages = [
      "Подготовка ресурсов...",
      "Загрузка персонажей...",
      "Синхронизация с блокчейном...",
      "Генерация перпов...",
      "Почти готово..."
    ];

    let msgIndex = 0;

    const interval = setInterval(() => {
      progress += Math.random() * 12 + 3;
      
      if (progress > 100) progress = 100;
      
      progressBar.style.width = progress + "%";
      statusText.textContent = messages[msgIndex];

      // Создаём искры
      if (Math.random() > 0.7) {
        createSpark();
      }

      if (progress >= 30 && msgIndex === 0) msgIndex = 1;
      if (progress >= 55 && msgIndex === 1) msgIndex = 2;
      if (progress >= 75 && msgIndex === 2) msgIndex = 3;
      if (progress >= 92 && msgIndex === 3) msgIndex = 4;

      if (progress >= 100) {
        clearInterval(interval);
        statusText.textContent = "Загрузка завершена!";
        setTimeout(() => {
          alert("✅ Загрузка завершена!\n(Это просто демонстрационная страница)");
        }, 800);
      }
    }, 120);

    function createSpark() {
      const spark = document.createElement('div');
      spark.className = 'spark';
      spark.textContent = '✦';
      spark.style.left = Math.random() * 100 + 'vw';
      spark.style.top = Math.random() * 70 + 'vh';
      document.body.appendChild(spark);
      
      setTimeout(() => spark.remove(), 1500);
    }
  </script>
</body>
</html>
