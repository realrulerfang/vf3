<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash of Perps</title>
  <link rel="icon" href="https://clashofperps.fun/icons/icon.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      height: 100vh;
      background: #4a9eff url('https://clashofperps.fun/splash-bg.png') center bottom no-repeat;
      background-size: cover;
      overflow: hidden;
      position: relative;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Маленькая иконка сверху слева */
    .floating-icon {
      position: absolute;
      top: 7%;
      left: 8%;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
      z-index: 20;
      border: 3px solid #ffcc00;
    }

    /* Логотипы дексов сверху справа */
    .top-logos {
      position: absolute;
      top: 5%;
      right: 5%;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 15;
    }

    .top-logos img {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.7);
      transition: all 0.2s;
    }

    .top-logos img:hover {
      transform: scale(1.12);
    }

    /* Главная надпись — увеличена и лучше отцентрирована */
    .header {
      position: absolute;
      top: 11%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .icon {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
    }

    .logo {
      width: 920px;        /* Значительно увеличено */
      height: auto;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.6));
    }

    .downloading {
      position: absolute;
      bottom: 26%;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 3px 3px 6px #000;
      letter-spacing: 3px;
      z-index: 10;
    }

    .progress-container {
      position: absolute;
      bottom: 17.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
      height: 42px;
      background: rgba(0, 0, 0, 0.75);
      border: 6px solid #ffcc00;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.7);
      z-index: 10;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffeb3b, #ff9800, #ffeb3b);
      transition: width 0.3s linear;
    }

    .percent {
      position: absolute;
      bottom: 8.5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 6px #000;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Маленькая иконка сверху -->
  <img src="https://clashofperps.fun/icons/icon.jpg" class="floating-icon" alt="Token">

  <!-- Логотипы дексов -->
  <div class="top-logos">
    <a href="https://basedbot.app/token/base/0x77a92f265bb58a3eec23f8c6157cb14f99fe7b07" target="_blank">
      <img src="https://basedbot.app/logo.png" alt="BasedBot">
    </a>
    <a href="https://o1.exchange/base/detail/0x980c0970d3b36f09454637161d796fb0022a21d7e76e8e4975bbb9d2932e5392?ca=0x77a92f265bb58a3eec23f8c6157cb14f99fe7b07" target="_blank">
      <img src="https://pbs.twimg.com/profile_images/2010294212177371136/kWzvlDOx_400x400.png" alt="O1 Exchange">
    </a>
  </div>

  <!-- Основная надпись -->
  <div class="header">
    <img src="https://clashofperps.fun/icons/icon.jpg" class="icon" alt="Icon">
    <img src="https://clashofperps.fun/splash-logo.png?v=splash-art" class="logo" alt="Clash of Perps">
  </div>

  <div class="downloading">DOWNLOADING GAME</div>

  <div class="progress-container">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div class="percent" id="percent">0%</div>

  <script>
    let progress = 0;
    const bar = document.getElementById('bar');
    const percentText = document.getElementById('percent');

    const interval = setInterval(() => {
      progress += Math.random() * 12 + 5;
      if (progress > 100) progress = 100;

      bar.style.width = progress + "%";
      percentText.textContent = Math.floor(progress) + "%";

      if (progress >= 100) {
        clearInterval(interval);
        percentText.textContent = "100%";
      }
    }, 80);
  </script>
</body>
</html>
