<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash of Perps</title>
  <link rel="icon" href="https://clashofperps.fun/icons/icon.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
   
    body {
      height: 100vh;
      background: #4a9eff url('https://clashofperps.fun/splash-bg.png') center 58% no-repeat;
      background-size: cover;
      overflow: hidden;
      position: relative;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Верхний блок */
    .top-section {
      position: absolute;
      top: 4.5%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
    }
    .trade-text {
      color: #ffffff;
      font-size: 21px;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      margin-bottom: 6px;
      letter-spacing: 1.5px;
    }
    .top-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    .top-logos img {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
    }

    /* Логотип игры */
    .header {
      position: absolute;
      top: 11.5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .logo {
      width: 1020px;
      height: auto;
      filter: drop-shadow(6px 10px 15px rgba(0,0,0,0.65));
    }

    /* Меч + Шкала в левом верхнем углу */
    .player-info {
      position: absolute;
      top: 25px;
      left: 35px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 25;
    }
    .sword {
      width: 58px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
    }

    .mc-container {
      display: flex;
      flex-direction: column;
    }
    .mc-bar {
      width: 210px;
      height: 22px;
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #ffcc00;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .mc-progress {
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, #ffeb3b, #ffb300);
      box-shadow: 0 0 10px #ffeb3b;
    }
    .mc-label {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-weight: bold;
      font-size: 14px;
      text-shadow: 1px 1px 3px #000;
    }
    .mc-value {
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }

    /* Нижняя часть */
    .downloading {
      position: absolute;
      bottom: 26%;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 3px 3px 8px #000;
      letter-spacing: 3px;
      z-index: 10;
    }

    .progress-container {
      position: absolute;
      bottom: 17.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
      height: 42px;
      background: rgba(0, 0, 0, 0.75);
      border: 6px solid #ffcc00;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.7);
      z-index: 10;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffeb3b, #ff9800, #ffeb3b);
      transition: width 0.3s linear;
    }
    .percent {
      position: absolute;
      bottom: 8.5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 6px #000;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- Торговля сверху -->
  <div class="top-section">
    <div class="trade-text">trade $CoP on:</div>
    <div class="top-logos">
      <a href="https://basedbot.app/token/base/0x77a92f265bb58a3eec23f8c6157cb14f99fe7b07" target="_blank">
        <img src="https://basedbot.app/logo.png" alt="BasedBot">
      </a>
      <a href="https://o1.exchange/base/detail/0x980c0970d3b36f09454637161d796fb0022a21d7e76e8e4975bbb9d2932e5392?ca=0x77a92f265bb58a3eec23f8c6157cb14f99fe7b07" target="_blank">
        <img src="https://o1.exchange/o1-logo.svg" alt="O1 Exchange">
      </a>
    </div>
  </div>

  <!-- Логотип игры -->
  <div class="header">
    <img src="https://clashofperps.fun/splash-logo.png?v=splash-art" class="logo" alt="Clash of Perps">
  </div>

  <!-- Меч + Шкала -->
  <div class="player-info">
    <img src="https://clashofperps.fun/icons/icon.jpg" class="sword" alt="Sword">

    <div class="mc-container">
      <div class="mc-bar">
        <div class="mc-progress"></div>
        <div class="mc-label">M.C</div>
      </div>
      <div class="mc-value">$CoP</div>
    </div>
  </div>

  <div class="downloading">DOWNLOADING GAME</div>
  
  <div class="progress-container">
    <div class="progress-bar" id="bar"></div>
  </div>
  
  <div class="percent" id="percent">0%</div>

  <script>
    let progress = 0;
    const bar = document.getElementById('bar');
    const percentText = document.getElementById('percent');
    const interval = setInterval(() => {
      progress += Math.random() * 12 + 5;
      if (progress > 100) progress = 100;
      bar.style.width = progress + "%";
      percentText.textContent = Math.floor(progress) + "%";
      if (progress >= 100) {
        clearInterval(interval);
        percentText.textContent = "100%";
      }
    }, 80);
  </script>
</body>
</html>
