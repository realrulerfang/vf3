<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash of Perps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      height: 100vh;
      background: #4a9eff url('https://clashofperps.fun/splash-bg.png') center bottom no-repeat;
      background-size: cover;
      overflow: hidden;
      position: relative;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .logo {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 620px;
      z-index: 10;
    }

    .progress-container {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 560px;
      height: 38px;
      background: rgba(0, 0, 0, 0.7);
      border: 5px solid #ffcc00;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
      z-index: 10;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffeb3b, #ff9800, #ffeb3b);
      transition: width 0.25s linear;
    }

    .percent {
      position: absolute;
      bottom: 9%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 6px #000;
      z-index: 10;
    }

    .downloading {
      position: absolute;
      bottom: 26%;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 26px;
      font-weight: bold;
      text-shadow: 2px 2px 5px #000;
      letter-spacing: 2px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <img src="https://clashofperps.fun/splash-logo.png?v=splash-art" class="logo" alt="Clash of Perps">

  <div class="downloading">DOWNLOADING GAME</div>

  <div class="progress-container">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div class="percent" id="percent">0%</div>

  <script>
    let progress = 0;
    const bar = document.getElementById('bar');
    const percentText = document.getElementById('percent');

    const interval = setInterval(() => {
      progress += Math.random() * 11 + 6;
      if (progress > 100) progress = 100;

      bar.style.width = progress + "%";
      percentText.textContent = Math.floor(progress) + "%";

      if (progress >= 100) {
        clearInterval(interval);
        percentText.textContent = "100%";
      }
    }, 85);
  </script>
</body>
</html>
