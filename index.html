<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash of Perps</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100vh;
      background: #4a9eff url('https://i.imgur.com/8zKzZfJ.png') center bottom no-repeat; /* замени на реальную ссылку */
      background-size: cover;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .logo {
      position: absolute;
      top: 15%;
      font-size: 82px;
      color: #ffcc00;
      text-shadow: 4px 4px 0 #000, -4px -4px 0 #000;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .progress-container {
      position: absolute;
      bottom: 18%;
      width: 560px;
      height: 42px;
      background: #1a1a1a;
      border: 5px solid #ffcc00;
      border-radius: 50px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffd000, #ff8c00);
      transition: width 0.25s;
    }
    .percent {
      position: absolute;
      bottom: 10%;
      font-size: 28px;
      color: white;
      text-shadow: 2px 2px 4px black;
    }
  </style>
</head>
<body>

  <div class="logo">Clash of Perps</div>

  <div class="progress-container">
    <div class="progress-bar" id="bar"></div>
  </div>
  <div class="percent" id="percent">0%</div>

  <script>
    let p = 0;
    const bar = document.getElementById('bar');
    const percent = document.getElementById('percent');

    const int = setInterval(() => {
      p += Math.random() * 12 + 5;
      if (p > 100) p = 100;
      bar.style.width = p + '%';
      percent.textContent = Math.floor(p) + '%';

      if (p >= 100) {
        clearInterval(int);
        percent.textContent = "100%";
      }
    }, 90);
  </script>
</body>
</html>
